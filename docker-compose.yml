services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - TARGET_BASE_URL=https://openrouter.ai
      - RELAY_SHARED_SECRET=${RELAY_SHARED_SECRET}
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

volumes:
  caddy_data:
  caddy_config:
