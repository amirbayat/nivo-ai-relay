services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - TARGET_BASE_URL=https://openrouter.ai
      - RELAY_SHARED_SECRET=${RELAY_SHARED_SECRET}
      - LOG_HEADERS=${LOG_HEADERS:-false}
      - LOG_PROMPTS=${LOG_PROMPTS:-true}
      # اختیاری — چندمقصدی (docs/PRD-video-edit-omni-kie.md §۳،
      # docs/PRD-telegram-bot-channel.md). قبلاً اینجا لیست نبودند، پس با اینکه در .env ست
      # می‌شدند، هرگز به کانتینر نمی‌رسیدند (docker compose فقط متغیرهای همین لیست را از .env
      # میزبان به process.env کانتینر تزریق می‌کند) — route های /kie و /telegram در نتیجه در
      # server.js همیشه فیلتر می‌شدند (route.target === undefined)، حتی وقتی .env درست بود.
      - KIE_TARGET_BASE_URL=${KIE_TARGET_BASE_URL:-}
      - KIE_UPLOAD_TARGET_BASE_URL=${KIE_UPLOAD_TARGET_BASE_URL:-}
      - TELEGRAM_TARGET_BASE_URL=${TELEGRAM_TARGET_BASE_URL:-}
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

volumes:
  caddy_data:
  caddy_config:
